      <text x="92" y="47" class="nav-subtitle">Portal Informasi &amp; Kesiapsiagaan Publik Kota Bandar Lampung</text>
      
      <text x="420" y="36" class="nav-link">Beranda</text><text x="514.5" y="36" class="nav-link">Berita &amp; Operasi</text><text x="694.5" y="36" class="nav-link-active">Dokumen &amp; SOP</text><line x1="694.5" y1="46" x2="792.0" y2="46" stroke="#1e40af" stroke-width="2.5" /><text x="846.0" y="36" class="nav-link">Galeri Edukasi</text><text x="1007.0" y="36" class="nav-link">Kontak &amp; Posko</text>

      <!-- Search input mock -->
      <rect x="960" y="17" width="190" height="32" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
      <text x="975" y="38" font-family="sans-serif" font-size="11" fill="#94a3b8">🔍 Cari informasi...</text>
    </g>
    

  <!-- BREADCRUMBS & HEADER -->
  <g transform="translate(40, 165)">
    <text x="0" y="15" class="text-sm">Beranda  /  <tspan fill="#1e40af" font-weight="bold">Dokumen Kedinasan &amp; SOP Publik</tspan></text>
    <text x="0" y="50" class="heading-xl">Dokumen Publik, SOP, dan Regulasi Penyelamatan</text>
    <text x="0" y="72" class="text-body">Akses transparan standar operasional prosedur, laporan akuntabilitas, dan berkas perizinan.</text>
  </g>

  <!-- FILTER & SEARCH BAR -->
