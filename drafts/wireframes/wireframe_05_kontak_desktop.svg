  </defs>

  <rect width="1200" height="1480" class="bg-canvas" />

  
    <!-- Browser Window Header -->
    <rect x="0" y="0" width="1200" height="46" class="browser-chrome" />
    <circle cx="20" cy="23" r="6" class="browser-dot-red" />
    <circle cx="38" cy="23" r="6" class="browser-dot-yellow" />
    <circle cx="56" cy="23" r="6" class="browser-dot-green" />
    <rect x="180" y="9" width="840" height="28" class="browser-url-bar" />
    <text x="600" y="28" class="text-url" text-anchor="middle">🔒 https://damkar.bandarlampungkota.go.id/kontak</text>
    
  
    <!-- Top Emergency Bar -->
    <g transform="translate(0, 46)">
