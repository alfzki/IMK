    <text x="15" y="52" class="heading-md" font-size="11">Kebakaran Gudang Kedaton Berhasil Dipadamkan</text>
    <text x="15" y="70" class="text-sm" font-size="9">15 Sep 2025 • Respon 11 menit • 6 Unit mobil</text>
